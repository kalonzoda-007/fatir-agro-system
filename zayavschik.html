:root{--dark:#2E3A2F;--dark2:#1f2921;--green:#6B7F5B;--bg:#F8F6EE;--paper:#fffdf7;--glass:rgba(255,255,255,.72);--line:rgba(46,58,47,.11);--muted:#7d857c;--ok:#5e815f;--warn:#a47b3e;--danger:#a96060;--info:#65788d;--shadow:0 10px 36px rgba(46,58,47,.045),inset 0 1px 0 rgba(255,255,255,.9);--field:rgba(255,255,255,.65);--soft:rgba(107,127,91,.075)}

  }
  async function beginSession() {
    offline = false;
    shell();
    await refresh();
    realtime();
  }
  async function boot(options) {
    config = options;
    role = options.role;
    Object.assign(actions, options.actions);
    Object.assign(forms, options.forms);
    currentSection = options.nav.some((n) => n.id === location.hash.slice(1)) ? location.hash.slice(1) : options.nav[0].id;
    overlays();
    try {
      await connect();
    } catch (e) {
      showOffline();
      toast(e.message, true);
    }
  }
  actions["nav"] = (el) => go(el.dataset.section);
  actions["modal-close"] = closeModal;
  actions["menu"] = () => document.querySelector(".sidebar").classList.toggle("open");
  actions["profile"] = () => openModal("\u0412\u0430\u0448 \u043F\u0440\u043E\u0444\u0438\u043B\u044C", "\u0410\u0432\u0442\u043E\u0440\u0438\u0437\u0430\u0446\u0438\u044F \u0438 \u0434\u0435\u0439\u0441\u0442\u0432\u0438\u044F \u043F\u0440\u0438\u0432\u044F\u0437\u0430\u043D\u044B \u043A \u044D\u0442\u043E\u0439 \u0443\u0447\u0451\u0442\u043D\u043E\u0439 \u0437\u0430\u043F\u0438\u0441\u0438", `<div class="row"><div class="avatar">${esc(initials(user.name))}</div><div><b>${esc(user.name)}</b><p class="subtitle">${roles[user.role]} \xB7 ID ${user.id}</p></div></div><div class="space">${note("\u041F\u0430\u0440\u043E\u043B\u044C \u0438 \u043F\u0440\u0430\u0432\u0430 \u0434\u043E\u0441\u0442\u0443\u043F\u0430 \u043C\u0435\u043D\u044F\u0435\u0442 \u0430\u0434\u043C\u0438\u043D\u0438\u0441\u0442\u0440\u0430\u0442\u043E\u0440.")}</div><div class="form-actions">${button(icon("logout") + "\u0412\u044B\u0439\u0442\u0438 \u0438\u0437 \u043F\u0440\u0438\u043B\u043E\u0436\u0435\u043D\u0438\u044F", "logout", "", "danger")}</div>`);
  actions["logout"] = async () => {
    await api("/auth/logout", "POST", {});
    showLogin();
  };
  actions["demo-login"] = async () => {
    user = await api("/auth/demo", "POST");
    await beginSession();
  };
  forms.login = async (form) => {
    user = await api("/auth/login", "POST", fd(form));

    return `<div class="progress-list">${order.progress.map((p) => `<div class="progress-step ${p.state}"><div class="progress-point">${p.state === "done" ? icon("check") : p.state === "problem" ? "!" : ""}</div><span>${esc(p.title)}</span><span class="step-label">${p.optional && p.state === "done" ? "\u041D\u0435 \u0442\u0440\u0435\u0431\u043E\u0432\u0430\u043B\u043E\u0441\u044C" : { done: "\u0412\u044B\u043F\u043E\u043B\u043D\u0435\u043D\u043E", active: "\u0412 \u043F\u0440\u043E\u0446\u0435\u0441\u0441\u0435", pending: "\u041D\u0435 \u043D\u0430\u0447\u0430\u0442\u043E", problem: "\u041F\u0440\u043E\u0431\u043B\u0435\u043C\u0430" }[p.state]}</span></div>`).join("")}</div>`;
  }
  function orderDetail(id, canReserve = false, whid = 1) {
    const order = () => S.orders.find((o) => o.id == id);
    if (!order()) return;
    openModal(() => esc(order()?.code || "\u0417\u0430\u043A\u0430\u0437"), () => `${esc(order()?.client_name || "")} \xB7 \u043E\u0431\u043D\u043E\u0432\u043B\u044F\u0435\u0442\u0441\u044F \u0430\u0432\u0442\u043E\u043C\u0430\u0442\u0438\u0447\u0435\u0441\u043A\u0438`, () => {
      const o = order();
      if (!o) return note("\u0417\u0430\u043A\u0430\u0437 \u0431\u043E\u043B\u044C\u0448\u0435 \u043D\u0435\u0434\u043E\u0441\u0442\u0443\u043F\u0435\u043D");
      const wt = S.tasks.find((t) => t.order_id === o.id);
      const shp = S.shipments.find((s) => s.order_id === o.id);
      const load = S.loading.find((l) => l.order_id === o.id);
      const queue = S.queue.find((q) => q.order_id === o.id && q.status !== "cancelled");
      let body = `<div class="row between">${badge(o.status, o.status_label)}<span class="small muted">${nf(o.expected_weight)} \u043A\u0433 \xB7 ${nf(o.items.reduce((a, x) => a + x.quantity, 0))} \u043C\u0435\u0448\u043A\u043E\u0432</span></div><div class="kv-grid space">${kv("\u041A\u043B\u0438\u0435\u043D\u0442", esc(o.client_name))}${kv("\u0422\u0435\u043B\u0435\u0444\u043E\u043D", `<a href="tel:${esc(o.client_phone)}">${esc(o.client_phone)}</a>`)}${kv("\u0414\u0430\u0442\u0430 \u043E\u0442\u0433\u0440\u0443\u0437\u043A\u0438", esc(o.due_date))}${kv("\u0417\u0430\u044F\u0432\u0449\u0438\u043A", esc(o.creator_name))}</div><div class="item-card"><small>\u041C\u0435\u0441\u0442\u043E \u0434\u043E\u0441\u0442\u0430\u0432\u043A\u0438</small><p class="subtitle" style="color:var(--dark)">${esc(o.address)}</p>${o.comment ? `<p class="subtitle">${esc(o.comment)}</p>` : ""}</div>`;
      if (o.problem) body += `<div class="space">${note(esc(o.problem), "danger", "alert")}</div>`;
      const reservable = canReserve && ["new", "review"].includes(o.status);
      if (reservable) body += `<div class="form-section">\u0420\u0435\u0437\u0435\u0440\u0432\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0435</div>${selectField("\u0421\u043A\u043B\u0430\u0434 \u0440\u0435\u0437\u0435\u0440\u0432\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u044F", "reserve_warehouse", warehouseOptions(), whid, `data-reserve-wh="${o.id}"`)}`;
      body += o.items.map((it) => {
        const stock = S.stock.find((s) => s.product_id === it.product_id && s.warehouse_id == whid);
        let lack = stock ? Math.max(0, it.quantity - stock.safe) : 0;
        return `<div class="item-card"><span class="sku">${it.sku} \xB7 ${nf(it.unit_weight)} \u043A\u0433 / \u043C\u0435\u0448\u043E\u043A</span><div class="row between"><b>${esc(it.name)}</b><b class="num">${nf(it.quantity)} <small>\u043C\u0435\u0448.</small></b></div><small>${nf(it.weight)} \u043A\u0433</small>${reservable && stock ? `<div class="stock-math"><div><small>\u0424\u0430\u043A\u0442\u0438\u0447\u0435\u0441\u043A\u0438</small><b>${nf(stock.actual)}</b></div><div><small>\u0420\u0435\u0437\u0435\u0440\u0432 \u0437\u0430\u043A\u0430\u0437\u043E\u0432</small><b>${nf(stock.reserved)}</b></div><div><small>\u041C\u0438\u043D. \u0440\u0435\u0437\u0435\u0440\u0432</small><b>${nf(stock.minimum)}</b></div><div><small>\u0414\u043B\u044F \u0437\u0430\u043A\u0430\u0437\u0430</small><b>${nf(stock.safe)}</b></div></div>${lack ? `<div class="space">${note(`\u041D\u0435\u0434\u043E\u0441\u0442\u0430\u0442\u043E\u0447\u043D\u043E <b>${nf(lack)} \u043C\u0435\u0448\u043A\u043E\u0432</b>. \u041F\u0440\u043E\u0438\u0437\u0432\u043E\u0434\u0441\u0442\u0432\u0435\u043D\u043D\u043E\u0435 \u0437\u0430\u0434\u0430\u043D\u0438\u0435 \u0441\u043E\u0437\u0434\u0430\u0441\u0442\u0441\u044F \u0430\u0432\u0442\u043E\u043C\u0430\u0442\u0438\u0447\u0435\u0441\u043A\u0438.`, "warn", "factory")}</div>` : ""}` : ""}</div>`;
      }).join("");
      if (reservable) {
        let deficit = o.items.reduce((a, it) => a + Math.max(0, it.quantity - (S.stock.find((s) => s.product_id === it.product_id && s.warehouse_id == whid)?.safe || 0)), 0);
        body += `<div class="next-action"><h4>\u0421\u043B\u0435\u0434\u0443\u044E\u0449\u0438\u0439 \u0448\u0430\u0433: \u043F\u043E\u0434\u0442\u0432\u0435\u0440\u0434\u0438\u0442\u044C \u0440\u0435\u0437\u0435\u0440\u0432</h4><p>${deficit ? `\u0414\u043E\u0441\u0442\u0443\u043F\u043D\u044B\u0439 \u0442\u043E\u0432\u0430\u0440 \u0437\u0430\u043A\u0440\u0435\u043F\u0438\u0442\u0441\u044F \u0437\u0430 \u0437\u0430\u043A\u0430\u0437\u043E\u043C. \u041D\u0430 ${nf(deficit)} \u043D\u0435\u0434\u043E\u0441\u0442\u0430\u044E\u0449\u0438\u0445 \u043C\u0435\u0448\u043A\u043E\u0432 \u0441\u0438\u0441\u0442\u0435\u043C\u0430 \u0441\u043E\u0437\u0434\u0430\u0441\u0442 \u043F\u0440\u043E\u0438\u0437\u0432\u043E\u0434\u0441\u0442\u0432\u043E.` : "\u0422\u043E\u0432\u0430\u0440 \u0437\u0430\u043A\u0440\u0435\u043F\u0438\u0442\u0441\u044F \u0437\u0430 \u0437\u0430\u043A\u0430\u0437\u043E\u043C, \u0441\u043A\u043B\u0430\u0434 \u0430\u0432\u0442\u043E\u043C\u0430\u0442\u0438\u0447\u0435\u0441\u043A\u0438 \u043F\u043E\u043B\u0443\u0447\u0438\u0442 \u0437\u0430\u0434\u0430\u043D\u0438\u0435 \u043D\u0430 \u043A\u043E\u043C\u043F\u043B\u0435\u043A\u0442\u0430\u0446\u0438\u044E."}</p><form data-form="reserve"><input type="hidden" name="order_id" value="${o.id}"><input type="hidden" name="warehouse_id" value="${whid}">${user.can_override_minimum ? `<details><summary class="small muted" style="cursor:pointer">\u0420\u0430\u0437\u0440\u0435\u0448\u0451\u043D\u043D\u043E\u0435 \u0438\u0441\u043A\u043B\u044E\u0447\u0435\u043D\u0438\u0435</summary><label class="checkbox"><input type="checkbox" name="override_minimum" id="override_minimum" data-override>\u042F\u0432\u043D\u043E \u0440\u0430\u0437\u0440\u0435\u0448\u0438\u0442\u044C \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u043D\u0438\u0435 \u043C\u0438\u043D\u0438\u043C\u0430\u043B\u044C\u043D\u043E\u0433\u043E \u0440\u0435\u0437\u0435\u0440\u0432\u0430</label><div id="override-reason" hidden>${field("\u041E\u0431\u043E\u0441\u043D\u043E\u0432\u0430\u043D\u0438\u0435", "reserve_reason", "text", "", 'maxlength="2000"')}</div></details>` : ""}<div class="form-error" role="alert"></div><button type="submit" class="btn primary big">${icon("lock")}\u0417\u0430\u0440\u0435\u0437\u0435\u0440\u0432\u0438\u0440\u043E\u0432\u0430\u0442\u044C${deficit ? " \u0438 \u0441\u043E\u0437\u0434\u0430\u0442\u044C \u043F\u0440\u043E\u0438\u0437\u0432\u043E\u0434\u0441\u0442\u0432\u043E" : ""}</button></form></div>`;
      } else if (o.status === "ready") body += `<div class="next-action"><h4>\u0417\u0430\u043A\u0430\u0437 \u0433\u043E\u0442\u043E\u0432. \u041E\u0436\u0438\u0434\u0430\u0435\u0442\u0441\u044F \u0430\u0432\u0442\u043E\u043C\u043E\u0431\u0438\u043B\u044C.</h4><p>\u041A\u041F\u041F \u0437\u0430\u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0438\u0440\u0443\u0435\u0442 \u043C\u0430\u0448\u0438\u043D\u0443, \u043F\u043E\u0441\u0442\u0430\u0432\u0438\u0442 \u0435\u0451 \u0432 \u043E\u0447\u0435\u0440\u0435\u0434\u044C \u0438 \u0432\u044B\u043F\u043E\u043B\u043D\u0438\u0442 \u0442\u0430\u0440\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0435.</p></div>`;
      else if (["need_production", "production", "shortage"].includes(o.status)) body += `<div class="next-action"><h4>\u041E\u0436\u0438\u0434\u0430\u0435\u0442\u0441\u044F \u043D\u0435\u0434\u043E\u0441\u0442\u0430\u044E\u0449\u0430\u044F \u043F\u0440\u043E\u0434\u0443\u043A\u0446\u0438\u044F</h4><p>\u041F\u0440\u043E\u0438\u0437\u0432\u043E\u0434\u0441\u0442\u0432\u043E \u0432\u044B\u043F\u0443\u0441\u0442\u0438\u0442 \u043F\u0430\u0440\u0442\u0438\u044E, \u0441\u043A\u043B\u0430\u0434 \u043F\u0440\u0438\u043C\u0435\u0442 \u0435\u0451 \u0438 \u043F\u0440\u043E\u0434\u043E\u043B\u0436\u0438\u0442 \u043A\u043E\u043C\u043F\u043B\u0435\u043A\u0442\u0430\u0446\u0438\u044E. \u0420\u0435\u0437\u0435\u0440\u0432 \u0434\u043E\u043F\u043E\u043B\u043D\u044F\u0435\u0442\u0441\u044F \u0430\u0432\u0442\u043E\u043C\u0430\u0442\u0438\u0447\u0435\u0441\u043A\u0438.</p>${canReserve ? button("\u041F\u043E\u0441\u043C\u043E\u0442\u0440\u0435\u0442\u044C \u043F\u0440\u043E\u0438\u0437\u0432\u043E\u0434\u0441\u0442\u0432\u043E " + icon("arrow"), "nav", 'data-section="production"', "green") : ""}</div>`;
      else if (o.status === "completed") body += `<div class="space">${note("\u0410\u0432\u0442\u043E\u043C\u043E\u0431\u0438\u043B\u044C \u0432\u044B\u0435\u0445\u0430\u043B. \u041E\u0442\u0433\u0440\u0443\u0437\u043A\u0430 \u0437\u0430\u043A\u0440\u044B\u0442\u0430, \u0442\u043E\u0432\u0430\u0440 \u0441\u043F\u0438\u0441\u0430\u043D, \u0440\u0435\u0437\u0435\u0440\u0432 \u0441\u043D\u044F\u0442.", "", "check")}</div>`;
      if (o.status === "awaiting_correction" || o.status === "weight_mismatch") body += `<div class="space">${note(`\u0412\u044B\u0435\u0437\u0434 \u0437\u0430\u043F\u0440\u0435\u0449\u0451\u043D. \u041A\u043E\u0440\u0440\u0435\u043A\u0442\u0438\u0440\u043E\u0432\u043A\u0443 \u0432\u044B\u043F\u043E\u043B\u043D\u044F\u0435\u0442 \u043F\u0435\u0440\u0432\u043E\u043D\u0430\u0447\u0430\u043B\u044C\u043D\u044B\u0439 \u043A\u043E\u043C\u043F\u043B\u0435\u043A\u0442\u043E\u0432\u0449\u0438\u043A${load ? ": <b>" + esc(load.picker_name) + "</b>" : ""}.`, "danger", "shield")}</div>`;
      if (canReserve) {
        body += `<div class="form-section">\u0421\u0432\u044F\u0437\u0430\u043D\u043D\u044B\u0435 \u0434\u043E\u043A\u0443\u043C\u0435\u043D\u0442\u044B</div><div class="row wrap">${wt ? `<a class="btn small" href="/api/documents/warehouse/${wt.id}.html?app=${role}" target="_blank">${icon("box")}${wt.code}</a>` : ""}${o.production_codes?.map((code) => `<span class="btn small">${icon("factory")}${code}</span>`).join("") || ""}${load ? `<a class="btn small" href="/api/documents/loading/${load.id}.html?app=${role}" target="_blank">${icon("truck")}${load.code}</a>` : ""}${shp ? `<a class="btn small" href="/api/documents/shipment/${shp.id}.html?app=${role}" target="_blank">${icon("file")}${shp.code}</a>` : ""}${!wt ? '<span class="small muted">\u041F\u043E\u044F\u0432\u044F\u0442\u0441\u044F \u043F\u043E\u0441\u043B\u0435 \u0440\u0435\u0437\u0435\u0440\u0432\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u044F</span>' : ""}</div>`;
      }
      body += `<div class="form-section">\u041F\u0443\u0442\u044C \u0437\u0430\u043A\u0430\u0437\u0430</div>${progress(o)}<div class="form-section">\u0414\u043E\u043A\u0443\u043C\u0435\u043D\u0442 \u0437\u0430\u043A\u0430\u0437\u0430</div>${docButtons("order", o.id)}`;
      const audit = S.audit.filter((e) => e.order_id === o.id).slice(0, 12);
      if (audit.length) body += `<div class="form-section">\u0418\u0441\u0442\u043E\u0440\u0438\u044F \u0441\u043E\u0431\u044B\u0442\u0438\u0439</div>${timeline(audit)}`;
      if (canReserve && !["completed", "cancelled"].includes(o.status) && !queue) body += `<div class="divider"></div><div class="row wrap">${o.status === "new" ? button("\u041F\u0440\u0438\u043D\u044F\u0442\u044C \u043D\u0430 \u0440\u0430\u0441\u0441\u043C\u043E\u0442\u0440\u0435\u043D\u0438\u0435", "order-review", `data-id="${o.id}"`, "small") : ""}${button(o.status === "paused" ? "\u0412\u043E\u0437\u043E\u0431\u043D\u043E\u0432\u0438\u0442\u044C" : "\u041F\u0440\u0438\u043E\u0441\u0442\u0430\u043D\u043E\u0432\u0438\u0442\u044C", "order-pause", `data-id="${o.id}"`, "small")}${button("\u041E\u0442\u043C\u0435\u043D\u0438\u0442\u044C \u0437\u0430\u043A\u0430\u0437", "order-cancel", `data-id="${o.id}"`, "small danger")}</div>`;
      return body;
    }, { drawer: true });
  }
  actions["order-open"] = (el) => orderDetail(el.dataset.id, role === "logist" || role === "admin");
  actions["order-review"] = (el) => mutate("/orders/" + el.dataset.id + "/review", {}, "\u0417\u0430\u043A\u0430\u0437 \u043D\u0430 \u0440\u0430\u0441\u0441\u043C\u043E\u0442\u0440\u0435\u043D\u0438\u0438", false);
  actions["order-cancel"] = (el) => confirmAction("\u041E\u0442\u043C\u0435\u043D\u0438\u0442\u044C \u0437\u0430\u043A\u0430\u0437?", "\u0422\u043E\u0432\u0430\u0440 \u043E\u0441\u0432\u043E\u0431\u043E\u0434\u0438\u0442\u0441\u044F \u0438\u0437 \u0440\u0435\u0437\u0435\u0440\u0432\u0430. \u0421\u043A\u043B\u0430\u0434\u044B \u0438 \u043F\u0440\u043E\u0438\u0437\u0432\u043E\u0434\u0441\u0442\u0432\u043E \u043F\u043E\u043B\u0443\u0447\u0430\u0442 \u0443\u0432\u0435\u0434\u043E\u043C\u043B\u0435\u043D\u0438\u0435.", (data) => mutate("/orders/" + el.dataset.id + "/cancel", data, "\u0417\u0430\u043A\u0430\u0437 \u043E\u0442\u043C\u0435\u043D\u0451\u043D"), "\u041E\u0442\u043C\u0435\u043D\u0438\u0442\u044C \u0437\u0430\u043A\u0430\u0437");
  actions["order-pause"] = (el) => {
    let o = S.orders.find((o2) => o2.id == el.dataset.id);
    if (o?.status === "paused") return mutate("/orders/" + o.id + "/pause", {}, "\u0420\u0430\u0431\u043E\u0442\u0430 \u0432\u043E\u0437\u043E\u0431\u043D\u043E\u0432\u043B\u0435\u043D\u0430");
    confirmAction("\u041F\u0440\u0438\u043E\u0441\u0442\u0430\u043D\u043E\u0432\u0438\u0442\u044C \u0437\u0430\u043A\u0430\u0437?", "\u0420\u0435\u0437\u0435\u0440\u0432 \u0441\u043E\u0445\u0440\u0430\u043D\u0438\u0442\u0441\u044F, \u043E\u0431\u0440\u0430\u0431\u043E\u0442\u043A\u0430 \u0437\u0430\u043A\u0430\u0437\u0430 \u043E\u0441\u0442\u0430\u043D\u043E\u0432\u0438\u0442\u0441\u044F \u0434\u043E \u0432\u043E\u0437\u043E\u0431\u043D\u043E\u0432\u043B\u0435\u043D\u0438\u044F.", (data) => mutate("/orders/" + el.dataset.id + "/pause", data, "\u0417\u0430\u043A\u0430\u0437 \u043F\u0440\u0438\u043E\u0441\u0442\u0430\u043D\u043E\u0432\u043B\u0435\u043D"), "\u041F\u0440\u0438\u043E\u0441\u0442\u0430\u043D\u043E\u0432\u0438\u0442\u044C");
  };
  forms.reserve = async (form) => {
    let v = fd(form);
    return mutate("/orders/" + v.order_id + "/reserve", { warehouse_id: Number(v.warehouse_id), override_minimum: v.override_minimum === "on", reason: v.reserve_reason || "" }, "\u0420\u0435\u0437\u0435\u0440\u0432 \u043F\u043E\u0434\u0442\u0432\u0435\u0440\u0436\u0434\u0451\u043D. \u0417\u0430\u0434\u0430\u043D\u0438\u044F \u043E\u0442\u043F\u0440\u0430\u0432\u043B\u0435\u043D\u044B \u0441\u043A\u043B\u0430\u0434\u0443 \u0438 \u043F\u0440\u043E\u0438\u0437\u0432\u043E\u0434\u0441\u0442\u0432\u0443");
