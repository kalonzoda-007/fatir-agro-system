name = "fatir-miniapp-staging"
main = "src/index.js"
compatibility_date = "2026-11-05"
workers_dev = true

[vars]
FRONTEND_ORIGIN = "https://kalonzoda-007.github.io"
ENABLE_ORDER_WRITES = "false"

# Add a D1 binding after creating the D1 database in Cloudflare.
# [[d1_databases]]
# binding = "FATIR_DB"
# database_name = "fatir-miniapp"
# database_id = "REPLACE_WITH_D1_DATABASE_ID"

# NEVER commit secret values. Configure via wrangler secret put:
# TELEGRAM_BOT_TOKEN
# N8N_BOOTSTRAP_URL
# N8N_SUBMIT_URL
# N8N_STATUS_URL
