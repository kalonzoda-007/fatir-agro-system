:root{--dark:#2e3a2f;--dark2:#1f2921;--green:#6b7f5b;--bg:#f8f6ee;--paper:#fffdf7;--glass:rgba(255,255,255,.72);--line:rgba(46,58,47,.11);--muted:#7d857c;--ok:#5e815f;--warn:#a47b3e;--danger:#a96060;--info:#65788d;--shadow:0 10px 36px rgba(46,58,47,.045),inset 0 1px 0 rgba(255,255,255,.9);--field:rgba(255,255,255,.65);--soft:rgba(107,127,91,.075)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:manrope,inter,-apple-system,blinkmacsystemfont,'segoe ui',sans-serif;font-size:13px;color:var(--dark);background:radial-gradient(ellipse at 0 5%,rgba(157,174,129,.12),transparent 35%),radial-gradient(ellipse at 94% 55%,rgba(232,218,186,.2),transparent 42%),var(--bg);min-height:100vh}button,input,select,textarea{font:inherit;color:inherit}button,a,input,select,textarea{outline-offset:4px}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}a{color:inherit;text-decoration:none}button{border:0}h1,h2,h3,h4,p{margin:0}h1{font-size:29px;font-weight:750;letter-spacing:-1.1px;line-height:1.3}h2{font-size:18px;letter-spacing:-.4px;font-weight:750}h3{font-size:15px;font-weight:750}h4{font-size:13px;font-weight:750}svg.icon{width:19px;height:19px;stroke:currentcolor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:middle}small,.small{font-size:11px}.muted{color:var(--muted)}.caps{font-size:9px;letter-spacing:1.65px;text-transform:uppercase;font-weight:800}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.stack{display:grid;gap:14px}.num{font-variant-numeric:tabular-nums}.mono{font-family:manrope,monospace;font-size:11px;letter-spacing:.2px}.space{margin-top:18px}.gap{gap:16px}.glass,.panel{background:var(--glass);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px)}.panel{padding:21px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:17px}.divider{height:1px;background:var(--line);margin:18px 0}
/* role-scoped shell */
.sidebar{position:fixed;inset:0 auto 0 0;width:226px;padding:29px 18px 20px;background:rgba(255,253,247,.58);backdrop-filter:blur(26px);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:70}.brand{display:flex;align-items:center;gap:11px;padding:0 9px}.brand img{width:42px;height:42px;border-radius:50%;box-shadow:0 3px 10px rgba(46,58,47,.12)}.brand b{font-size:24px;letter-spacing:1.2px;line-height:1.1;font-weight:800}.brand small{display:block;color:var(--muted);font-size:7px;letter-spacing:1.9px;margin-top:6px;font-weight:750}.role-label{display:flex;gap:10px;align-items:center;margin:32px 3px 27px;padding:12px;background:rgba(107,127,91,.065);border:1px solid var(--line);border-radius:13px;font-size:12px;font-weight:700}.role-label .icon{width:17px}.role-label small{font-weight:500;color:var(--muted);font-size:9px;display:block;margin-top:2px}.nav-heading{padding-left:15px;color:#99a092;margin-bottom:13px}.nav{display:grid;gap:5px}.nav-btn{width:100%;min-height:43px;padding:11px 13px;display:flex;align-items:center;gap:12px;border-radius:11px;color:#75816f;font-weight:600;font-size:12px;background:transparent;text-align:left;transition:.18s}.nav-btn .icon{width:18px;height:18px;opacity:.85}.nav-btn:hover{background:var(--soft);color:var(--dark)}.nav-btn.active{background:var(--dark);color:var(--paper);box-shadow:0 4px 14px rgba(46,58,47,.12)}.nav-btn .nav-count{margin-left:auto;min-width:18px;text-align:center;font-size:10px;padding:2px 5px;border-radius:5px;background:rgba(255,255,255,.12)}.nav-btn:not(.active) .nav-count{background:rgba(107,127,91,.12);color:var(--green)}.side-bottom{margin-top:auto;padding:22px 6px 0}.side-help{padding:15px;border-radius:15px;background:linear-gradient(140deg,rgba(213,222,193,.35),rgba(255,255,255,.6));border:1px solid var(--line);font-size:10px;line-height:1.8}.side-help b{display:block;font-size:11px;margin-bottom:4px}.side-help .icon{width:16px}.side-help button{padding:0;background:none;font-size:10px;text-decoration:underline;color:var(--green);margin-top:10px}.side-foot{display:flex;align-items:center;gap:6px;font-size:9px;color:var(--muted);margin-top:20px;padding-left:8px}.online-dot{width:6px;height:6px;border-radius:50%;background:#719866;box-shadow:0 0 0 3px rgba(113,152,102,.09);display:inline-block}.shell{margin-left:226px}.topbar{height:78px;padding:0 34px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:60;background:rgba(248,246,238,.8);backdrop-filter:blur(26px)}.breadcrumbs{font-size:11px;display:flex;align-items:center;gap:12px;color:var(--muted)}.breadcrumbs .icon{width:14px;height:14px}.breadcrumbs b{font-weight:600;color:var(--dark)}.top-actions{display:flex;align-items:center;gap:16px}.live-pill{font-size:10px;color:var(--green);display:flex;align-items:center;gap:7px}.icon-btn{width:35px;height:35px;border-radius:10px;background:rgba(255,255,255,.45);border:1px solid var(--line);display:grid;place-items:center;position:relative;transition:.16s}.icon-btn:hover{background:white}.icon-btn .icon{width:17px;height:17px}.notif-dot{position:absolute;right:7px;top:7px;width:5px;height:5px;border-radius:50%;background:var(--warn);border:1px solid var(--bg)}.profile{display:flex;align-items:center;gap:10px;background:none;text-align:left;border-left:1px solid var(--line);padding:0 0 0 17px}.avatar{width:35px;height:35px;flex-shrink:0;border-radius:11px;background:#ebe9dc;border:1px solid rgba(174,171,129,.13);display:grid;place-items:center;font-size:10px;font-weight:800;color:#73745b}.profile b{font-size:10px;font-weight:750}.profile small{font-size:9px;color:var(--muted);display:block;margin-top:2px}.profile>.icon{width:11px;height:11px;margin-left:4px}.mobile-toggle{display:none}.content{padding:30px 34px 25px;max-width:1740px;margin:0 auto}.page-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:26px}.eyebrow{font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:var(--green);font-weight:650;margin-bottom:8px}.subtitle{color:var(--muted);font-size:11px;line-height:1.8;margin-top:8px}.heading-actions{display:flex;align-items:center;gap:10px;padding-top:15px}.date-chip{padding:10px 13px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.5);color:var(--muted);font-size:10px;display:flex;gap:7px;align-items:center;white-space:nowrap}.date-chip .icon{width:13px;height:13px}.demo-tag{font-size:8px;letter-spacing:.5px;border-radius:5px;color:#9b865a;background:#f3edde;padding:3px 5px;margin-left:2px}.btn{border:1px solid var(--line);background:var(--glass);border-radius:11px;padding:10px 14px;font-size:11px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.18s;min-height:37px;white-space:nowrap}.btn .icon{width:15px;height:15px}.btn:hover{background:#fff;box-shadow:0 4px 12px rgba(46,58,47,.06);transform:translatey(-1px)}.btn.primary{background:var(--dark);color:white;border-color:var(--dark);box-shadow:0 4px 10px rgba(46,58,47,.08)}.btn.primary:hover{background:#45513e}.btn.green{background:#e9eee2;color:var(--green);border-color:#dce3d1}.btn.danger{color:var(--danger)}.btn.small{min-height:31px;font-size:10px;padding:7px 11px}.btn.big{padding:14px 20px;font-size:13px;width:100%;min-height:47px}.btn.text{background:none;border-color:transparent;box-shadow:none;padding:4px;color:var(--green);min-height:22px}.btn.text:hover{transform:none;text-decoration:underline}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:22px}.stat{padding:19px 21px;position:relative;cursor:pointer;transition:.2s;overflow:hidden;min-height:122px}.stat:hover{transform:translatey(-2px);border-color:rgba(107,127,91,.28)}.stat-label{font-size:11px;color:var(--muted);font-weight:550;display:flex;align-items:center;justify-content:space-between}.stat-ico{width:32px;height:32px;border-radius:10px;background:var(--soft);display:grid;place-items:center;color:var(--green);margin-top:-3px}.stat-ico .icon{width:16px;height:16px}.stat-number{font-size:32px;letter-spacing:-1px;line-height:1.25;font-weight:750;margin:6px 0 7px}.stat-caption{font-size:9px;color:var(--muted);display:flex;align-items:center;gap:5px}.stat-caption .icon{width:11px;height:11px}.stat.warn .stat-ico{background:#f5eddb;color:var(--warn)}.stat.warn .stat-caption{color:var(--warn)}.stat.warn{background:linear-gradient(140deg,rgba(252,248,238,.88),rgba(255,255,255,.66))}.stat.ok .stat-caption{color:var(--ok)}
/* overview conveyor */
.flow-panel{padding:18px 22px;margin-bottom:22px}.flow-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.flow-title h3{font-size:12px}.flow-title span{font-size:9px;color:var(--muted)}.flow{display:flex;gap:12px;align-items:center}.flow-step{display:flex;align-items:center;gap:11px;flex:1;min-width:0;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.4);cursor:pointer;text-align:left}.flow-step:hover{background:var(--soft)}.flow-step .flow-ico{width:30px;height:30px;background:#edf0e7;color:var(--green);border-radius:9px;display:grid;place-items:center}.flow-step .icon{width:16px;height:16px}.flow-step small{display:block;color:var(--muted);font-size:9px;margin-bottom:2px}.flow-step b{font-size:15px}.flow-step em{font-style:normal;font-size:9px;color:var(--muted);margin-left:4px;font-weight:500}.flow-arrow{color:#c0c6b6;flex:0}.flow-arrow .icon{width:12px;height:12px}.flow-step .tinybar{height:3px;border-radius:5px;background:#e4e9dc;width:44px;margin-top:5px}.flow-step .tinybar i{display:block;height:100%;background:#95a486;border-radius:5px}

  document.addeventlistener("click", async (e) => {
    if (e.target.id === "modal") {
      closemodal();
      return;
    }
    const el = e.target.closest("[data-action]");
    if (!el || el.disabled || busy) return;
    if (offline && !["nav", "menu", "modal-close", "server-settings", "help", "profile"].includes(el.dataset.action)) {
      e.preventdefault();
      openconnection();
      return;
    }
    const handler = actions[el.dataset.action];
    if (!handler) return;
    if (el.dataset.action !== "nav" && el.closest("tr")) e.preventdefault();
    try {
      const p = handler(el, e);
      if (p?.then) {
        busy = true;
        el.setattribute("aria-busy", "true");
        await p;
      }
    } catch (err) {
      showerror(err);
    } finally {
      busy = false;
      el.removeattribute("aria-busy");
    }
  });
  document.addeventlistener("submit", async (e) => {
    const form = e.target.closest("form[data-form]");
    if (!form) return;
    e.preventdefault();
    if (busy) return;
    if (offline && form.dataset.form !== "server-connect") {
      openconnection();
      return;
    }
    const handler = forms[form.dataset.form];
    if (!handler) return;
    try {
      busy = true;
      form.queryselectorall("[type=submit]").foreach((b) => b.disabled = true);
      const box = form.queryselector(".form-error");
      if (box) box.textcontent = "";
      await handler(form);
    } catch (err) {
      showerror(err);
      const box = form.queryselector(".form-error");
      if (box) box.textcontent = err.message;
    } finally {
      busy = false;
      form.queryselectorall("[type=submit]").foreach((b) => b.disabled = false);
    }
  });
  document.addeventlistener("input", (e) => {
    if (e.target.dataset.filter) config?.onfilter?.(e.target.dataset.filter, e.target.value);
    config?.oninput?.(e.target);
  });
  document.addeventlistener("change", (e) => {
    if (e.target.dataset.filter && e.target.tagname === "select") config?.onfilter?.(e.target.dataset.filter, e.target.value);
    config?.onchange?.(e.target);
  });
  document.addeventlistener("keydown", (e) => {
    if (e.key === "escape") {
      closemodal();
      document.queryselector(".sidebar")?.classlist.remove("open");
    }
    if (e.key === "tab" && document.getelementbyid("modal")?.classlist.contains("open")) {
      let els = [...document.queryselectorall("#modal button:not(:disabled),#modal a,#modal input,#modal select,#modal textarea")].filter((el) => el.offsetparent);
      if (!els.length) return;
      let first = els[0], last = els.at(-1);
      if (e.shiftkey && document.activeelement === first) {
        e.preventdefault();
        last.focus();
      } else if (!e.shiftkey && document.activeelement === last) {
        e.preventdefault();
        first.focus();
      }
    }
  });
  async function connect() {
    meta = await api("/meta");
    try {
      user = await api("/auth/me");
    } catch (e) {
      if (e.status !== 401) throw e;
      if (meta.demo) user = await api("/auth/demo", "post");
      else return showlogin();
    }
    await beginsession();
  }
  function showoffline() {

    s = { user, today: new date(date.now() + 5 * 36e5).toisostring().slice(0, 10), settings: {}, products: [] };
    for (const key of ["orders", "clients", "warehouses", "cells", "inventory", "stock", "tasks", "production", "lots", "transfers", "movements", "vehicles", "drivers", "employees", "loading", "shipments", "queue", "weighings", "passes", "people", "audit", "users", "notifications"]) s[key] = [];
    shell();
    renderapp();
    livestatus(false);
    document.getelementbyid("live").queryselector(".live-text").textcontent = "\u041d\u0435\u0442 \u0441\u043e\u0435\u0434\u0438\u043d\u0435\u043d\u0438\u044f";

  function openconnection() {

  document.addeventlistener("click", async (e) => {
    const a = e.target.closest("a[href]");
    const raw = a?.getattribute("href");
    if (!raw?.startswith("/api/")) return;
    if (raw === "/api/docs") {
      if (serveraddress()) {
        a.href = serveraddress() + raw;
        return;
      }
      e.preventdefault();
      openconnection();
      return;
    }
    e.preventdefault();
    if (offline) {
      openconnection();
      return;
    }
    const printing = raw.includes(".html");
    const tab = printing ? window.open("", "_blank") : null;
    try {
      const r = await request(raw.slice(4), role, user?.csrf);
      if (!r.ok) {
        let data = await r.json();
        throw new error(data.detail || "\u0414\u043e\u043a\u0443\u043c\u0435\u043d\u0442 \u043d\u0435\u0434\u043e\u0441\u0442\u0443\u043f\u0435\u043d");
      }
      const blob = await r.blob(), url = url.createobjecturl(blob);
      if (printing && tab) {
        tab.location.href = url;
      } else {
        const link = document.createelement("a");
        link.href = url;
        const match = r.headers.get("content-disposition")?.match(/filename="([^"]+)"/);
        link.download = match?.[1] || raw.split("?")[0].split("/").at(-1);
        document.body.append(link);
        link.click();
        link.remove();
      }
      settimeout(() => url.revokeobjecturl(url), 12e4);
    } catch (error) {
      tab?.close();
      showerror(error);
    }
  });

  function conveyor() {

  function drivernew() {
    openmodal("\u041d\u043e\u0432\u044b\u0439 \u0432\u043e\u0434\u0438\u0442\u0435\u043b\u044c", "\u041a\u043e\u0434 drv-###### \u043f\u0440\u0438\u0441\u0432\u043e\u0438\u0442\u0441\u044f \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438", `<form data-form="driver"><div class="form-grid">${field("\u0424\u0418\u041e", "name", "text", "", "required")}${field("\u0422\u0435\u043b\u0435\u0444\u043e\u043d", "phone", "tel", "", 'required placeholder="+992 \u2026"')}${field("\u0423\u0434\u043e\u0441\u0442\u043e\u0432\u0435\u0440\u0435\u043d\u0438\u0435", "license")}</div>${formend("\u0414\u043e\u0431\u0430\u0432\u0438\u0442\u044c \u0432\u043e\u0434\u0438\u0442\u0435\u043b\u044f")}</form>`, { frozen: true });
  }
  function vehiclenew() {
    openmodal("\u041d\u043e\u0432\u0430\u044f \u043c\u0430\u0448\u0438\u043d\u0430", "\u041a\u043e\u0434 veh-###### \u043f\u0440\u0438\u0441\u0432\u043e\u0438\u0442\u0441\u044f \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u0435\u0441\u043a\u0438", `<form data-form="vehicle"><div class="form-grid">${field("\u0413\u043e\u0441\u043d\u043e\u043c\u0435\u0440", "plate", "text", "", 'required placeholder="1842 ab 02" maxlength="30"')}${field("\u0413\u0440\u0443\u0437\u043e\u043f\u043e\u0434\u044a\u0451\u043c\u043d\u043e\u0441\u0442\u044c, \u043a\u0433", "capacity", "number", 2e4, 'required min="1"')}${field("\u041c\u0430\u0440\u043a\u0430", "brand")}${field("\u041c\u043e\u0434\u0435\u043b\u044c", "model")}<div class="full">${selectfield("\u0412\u043e\u0434\u0438\u0442\u0435\u043b\u044c", "driver_id", [[0, "\u0411\u0435\u0437 \u0432\u043e\u0434\u0438\u0442\u0435\u043b\u044f"], ...s.drivers.map((d) => [d.id, d.name + " \xb7 " + d.code])])}</div>${field("\u041e\u0440\u0433\u0430\u043d\u0438\u0437\u0430\u0446\u0438\u044f", "organization")}${field("\u0422\u0435\u043b\u0435\u0444\u043e\u043d", "phone", "tel")}</div>${formend("\u0414\u043e\u0431\u0430\u0432\u0438\u0442\u044c \u043c\u0430\u0448\u0438\u043d\u0443")}</form>`, { frozen: true });
  }
  function dorender() {
    paint(({ home, orders: () => pageheading("\u0417\u0430\u043a\u0430\u0437\u044b \u043a\u043b\u0438\u0435\u043d\u0442\u043e\u0432", "\u041a\u0430\u0436\u0434\u044b\u0439 \u0437\u0430\u043a\u0430\u0437 \u2014 \u043d\u0430 \u0432\u0438\u0434\u0443", "\u041e\u0442\u043a\u0440\u043e\u0439\u0442\u0435 \u0437\u0430\u044f\u0432\u043a\u0443, \u043f\u0440\u043e\u0432\u0435\u0440\u044c\u0442\u0435 \u043d\u0430\u043b\u0438\u0447\u0438\u0435 \u0438 \u043f\u043e\u0434\u0442\u0432\u0435\u0440\u0434\u0438\u0442\u0435 \u0440\u0435\u0437\u0435\u0440\u0432.", button(icon("plus") + "\u041d\u043e\u0432\u0430\u044f \u0437\u0430\u044f\u0432\u043a\u0430", "order-new", "", "primary")) + ordertable() + foot(), inventory, warehouse, production, loading, vehicles, history: history2 }[currentsection] || home)());
  }
  actions["order-tab"] = (el) => {
    filters.status = el.dataset.status;
    page = 1;
    render();
  };
  actions["order-page"] = (el) => {
    page = number(el.dataset.page);
    render();
  };
  actions["stats-filter"] = (el) => {
    filters = { q: "", status: "", preset: el.dataset.preset };
    page = 1;
    go("orders");
  };
  actions["flow-filter"] = (el) => {
    filters = { q: "", status: el.dataset.status };
    page = 1;
    go(number(el.dataset.step) === 2 ? "production" : number(el.dataset.step) === 3 ? "loading" : number(el.dataset.step) === 4 ? "vehicles" : "orders");
    if (currentsection === "production" || currentsection === "loading" || currentsection === "vehicles") {
      filters = { q: "" };
      render();
    }
  };
  actions["attention-all"] = () => {
    filters = { q: "", status: "attention" };
    page = 1;
    go("orders");
  };
  actions["fleet-queue"] = () => {
    fleettab = "queue";
    filters = { q: "", status: "active" };
    go("vehicles");
  };
  actions["fleet-tab"] = (el) => {
    fleettab = el.dataset.tab;
    filters = { q: "" };
    render();
  };
  actions["minimum-open"] = () => minopen();
  actions["minimum-row"] = (el) => minopen(el.dataset.product, el.dataset.warehouse);
  actions["task-open"] = (el) => taskopen(el.dataset.id);
  actions["production-open"] = (el) => prodopen(el.dataset.id);
  actions["load-info"] = (el) => loadinfo(el.dataset.id);
  actions["queue-info"] = (el) => {
    const q = s.queue.find((q2) => q2.id == el.dataset.id);
    orderdetail(q.order_id, true);
  };
  actions["team-retry"] = (el) => mutate("/loading/" + el.dataset.id + "/assign", {}, "\u0411\u0440\u0438\u0433\u0430\u0434\u0430 \u043d\u0430\u0437\u043d\u0430\u0447\u0435\u043d\u0430");
  actions["driver-new"] = drivernew;
  actions["vehicle-new"] = vehiclenew;
  forms.minimum = (form) => {
    let v = fd(form);
    return mutate(number(v.warehouse_id) ? "/minimum-reserves" : "/products/" + v.product_id + "/minimum", { product_id: number(v.product_id), warehouse_id: number(v.warehouse_id), quantity: number(v.quantity) }, "\u041c\u0438\u043d\u0438\u043c\u0430\u043b\u044c\u043d\u044b\u0439 \u0440\u0435\u0437\u0435\u0440\u0432 \u0441\u043e\u0445\u0440\u0430\u043d\u0451\u043d");
  };
  forms.driver = (form) => mutate("/drivers", fd(form), "\u0412\u043e\u0434\u0438\u0442\u0435\u043b\u044c \u0434\u043e\u0431\u0430\u0432\u043b\u0435\u043d");
  forms.vehicle = (form) => {
    let v = fd(form);
    return mutate("/vehicles", { ...v, capacity: number(v.capacity), driver_id: number(v.driver_id) || null }, "\u041c\u0430\u0448\u0438\u043d\u0430 \u0434\u043e\u0431\u0430\u0432\u043b\u0435\u043d\u0430");
  };
  var oldnav = actions.nav;
  actions.nav = (el) => {
    filters = { q: "", status: "", preset: "" };
    page = 1;
    oldnav(el);
  };
  boot({
    role: "logist",
    nav,
    render: dorender,
    counts: () => ({ orders: s.orders.filter((o) => o.status === "new").length, production: deficitorders().length, loading: s.loading.filter((l) => ["loading", "correction", "waiting_team"].includes(l.status)).length }),
    onfilter: (key, value) => {
      filters[key] = value;
      page = 1;
      render();
    },
    oninput: onorderinput,
    onchange: (el) => {
      onorderchange(el);
      const form = el.closest('form[data-form="minimum"]');
      if (form && ["product_id", "warehouse_id"].includes(el.name)) {
        const v = fd(form);
        const p = s.products.find((p2) => p2.id == v.product_id), st = s.stock.find((s) => s.product_id == v.product_id && s.warehouse_id == v.warehouse_id);
        form.elements.quantity.value = number(v.warehouse_id) ? st?.minimum ?? 30 : p?.minimum_reserve ?? 30;
      }
    },
    tablefilters: (kind) => searchfilter(filters.q, "\u041d\u043e\u043c\u0435\u0440, \u0442\u043e\u0432\u0430\u0440 \u0438\u043b\u0438 \u0441\u043e\u0442\u0440\u0443\u0434\u043d\u0438\u043a\u2026", kind === "inventory" ? `<select class="filter-select" data-filter="warehouse" aria-label="\u0421\u043a\u043b\u0430\u0434">${warehouseoptions().map(([id, label]) => `<option value="${id}" ${filters.warehouse == id ? "selected" : ""}>${esc(label)}</option>`).join("")}</select>` : `<select class="filter-select" data-filter="status" aria-label="\u0421\u0442\u0430\u0442\u0443\u0441"><option value="">\u0412\u0441\u0435 \u0441\u0442\u0430\u0442\u0443\u0441\u044b</option><option value="active" ${filters.status === "active" ? "selected" : ""}>\u0412 \u0440\u0430\u0431\u043e\u0442\u0435</option><option value="done" ${filters.status === "done" ? "selected" : ""}>\u0417\u0430\u0432\u0435\u0440\u0448\u0435\u043d\u043e</option></select>`),
    help: "\u041d\u0430\u0447\u043d\u0438\u0442\u0435 \u0441 \u043d\u043e\u0432\u044b\u0445 \u0437\u0430\u043a\u0430\u0437\u043e\u0432. \u041e\u0442\u043a\u0440\u043e\u0439\u0442\u0435 \u0437\u0430\u044f\u0432\u043a\u0443 \u0438 \u043d\u0430\u0436\u043c\u0438\u0442\u0435 \xab\u0417\u0430\u0440\u0435\u0437\u0435\u0440\u0432\u0438\u0440\u043e\u0432\u0430\u0442\u044c\xbb. \u0421\u0438\u0441\u0442\u0435\u043c\u0430 \u0441\u0430\u043c\u0430 \u0440\u0430\u0441\u0441\u0447\u0438\u0442\u0430\u0435\u0442 \u0431\u0435\u0437\u043e\u043f\u0430\u0441\u043d\u044b\u0439 \u043e\u0441\u0442\u0430\u0442\u043e\u043a, \u0441\u043e\u0437\u0434\u0430\u0441\u0442 \u0441\u043a\u043b\u0430\u0434\u0441\u043a\u043e\u0435 \u0437\u0430\u0434\u0430\u043d\u0438\u0435 \u0438 \u043f\u0440\u043e\u0438\u0437\u0432\u043e\u0434\u0441\u0442\u0432\u043e \u043d\u0430 \u0434\u0435\u0444\u0438\u0446\u0438\u0442."
  }).catch((e) => {
    console.error(e);
    paint(note("\u041d\u0435 \u0443\u0434\u0430\u043b\u043e\u0441\u044c \u043f\u043e\u0434\u043a\u043b\u044e\u0447\u0438\u0442\u044c\u0441\u044f \u043a \u0441\u0435\u0440\u0432\u0435\u0440\u0443. " + esc(e.message), "danger"));
  });
})();
